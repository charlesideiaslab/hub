<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Manrope";
    src: url("../assets/manrope-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 800;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(820px 480px at 12% -10%, rgba(224,121,91,.12), transparent 62%),
      #0E0D0B;
    color: #F2EFE8;
    font-family: "Manrope", sans-serif;
    padding: 54px 64px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .topo { display: flex; justify-content: space-between; align-items: baseline; }
  .marca { font-size: 15px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; }
  .status { font-family: Consolas, monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #9A9283; }
  h1 { font-size: 96px; line-height: .99; font-weight: 400; letter-spacing: -.052em; max-width: 880px; }
  .baixo { border-top: 1px solid #3A342B; padding-top: 22px; }
  ul { list-style: none; display: flex; gap: 38px; }
  li { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500; letter-spacing: -.01em; }
  .chip { width: 10px; height: 10px; border-radius: 2px; }
  .marca-canto { position: absolute; width: 9px; height: 9px; border-top: 1px solid #4A4337; border-left: 1px solid #4A4337; top: 22px; left: 22px; }
  .marca-canto.baixo { top: auto; left: auto; right: 22px; bottom: 22px; border: 0; border-right: 1px solid #4A4337; border-bottom: 1px solid #4A4337; }
</style>
</head>
<body>
  <span class="marca-canto"></span><span class="marca-canto baixo"></span>
  <div class="topo">
    <span class="marca">Charles Ideias Lab</span>
    <span class="status">Índice · 2026</span>
  </div>
  <h1>Memória em forma<br>de filme<span style="color:#E0795B">.</span></h1>
  <div class="baixo">
    <ul>
      <li><span class="chip" style="background:#E0795B"></span>Cicatriz Sonora</li>
      <li><span class="chip" style="background:#A79F91"></span>Contato</li>
    </ul>
  </div>
</body>
</html>
