<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../assets/archivo-latin.woff2") format("woff2");
    font-weight: 300 700;
    font-style: normal;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: #050505;
    color: #edeae3;
    font-family: "Archivo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .conteudo {
    text-align: center;
    z-index: 1;
  }
  .marca {
    font-size: 72px;
    font-weight: 500;
    letter-spacing: -0.035em;
    text-transform: uppercase;
    line-height: 1;
  }
  .lab {
    margin-top: 8px;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #8a8780;
  }
  .frase {
    margin-top: 36px;
    font-size: 16px;
    font-style: italic;
    color: #8a8780;
  }
</style>
</head>
<body>
  <div class="conteudo">
    <div class="marca">Charles Ideias</div>
    <div class="lab">Lab</div>
    <div class="frase">Filmes, música e histórias que precisam existir.</div>
  </div>
</body>
</html>
